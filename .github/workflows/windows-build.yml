name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar o código e os arquivos LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências do backend
        run: npm ci
        working-directory: hud-assistant-backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/urfilig
          DIRECT_URL: postgresql://ci:ci@localhost:5432/urfilig

      - name: Instalar dependências do frontend
        run: npm ci
        working-directory: hud-assistant-frontend

      - name: Instalar dependências do desktop
        run: npm ci
        working-directory: hud-assistant-desktop

      - name: Compilar instalador NSIS
        run: npm run build
        working-directory: hud-assistant-desktop
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Urfilig-Windows-NSIS
          path: hud-assistant-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
