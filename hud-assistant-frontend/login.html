<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Entrar — Urfilig</title>
  
  <!-- CSS injetado diretamente no HTML para contornar o cache do Tauri -->
  <style>
    body {
      background-color: #040a0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .tela-centralizada {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .cartao {
      background-color: #0a181e;
      padding: 2.5rem;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    #titulo-form {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 1rem;
      color: #e2e8f0;
      margin-top: 0;
    }

    #form-login {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    #form-login label {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: -0.5rem;
    }

    #form-login input {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      border: 1px solid #1e293b;
      background-color: #0f172a;
      color: white;
      outline: none;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    #form-login input:focus {
      border-color: #38bdf8;
    }

    .bolha-btn {
      background-color: #38bdf8;
      color: #0f172a;
      padding: 0.85rem;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 0.5rem;
    }

    .bolha-btn:hover {
      background-color: #7dd3fc;
    }

    .btn-texto-simples {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .btn-texto-simples:hover {
      color: #f8fafc;
    }

    .separador {
      text-align: center;
      color: #475569;
      font-size: 0.85rem;
      margin: 0.5rem 0;
    }

    #mensagem-erro {
      color: #f87171;
      font-size: 0.85rem;
      text-align: center;
      min-height: 1rem;
    }

    #google-signin-button {
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body class="tela-centralizada">
  <div class="cartao">
    <h1 id="titulo-form">Entrar na Urfilig</h1>

    <form id="form-login">
      <div id="campo-nome" hidden>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" autocomplete="name" />
      </div>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="email" required />

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required minlength="8" />

      <button type="submit" id="botao-enviar" class="bolha-btn">Entrar</button>
      <div id="mensagem-erro" role="alert"></div>
    </form>

    <button type="button" id="alternar-modo" class="btn-texto-simples">Criar uma conta</button>

    <div class="separador">ou</div>

    <div id="google-signin-button"></div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="/src/login.js"></script>
</body>
</html>
